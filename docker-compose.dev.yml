services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: osticket
      MARIADB_USER: osticket
      MARIADB_PASSWORD: osticket
    ports:
      - "13306:3306"

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "18080:80"
    depends_on:
      - db
